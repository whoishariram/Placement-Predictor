# ============================================
# Placement Predictor - Docker Compose
# ============================================

version: '3.8'

services:
  # Backend API - Flask + Gunicorn
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placement-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - FLASK_ENV=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - DATABASE_URL=sqlite:////app/database/placement.db
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80,https://*.onrender.com
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - backend_data:/app/dataset
      - backend_data:/app/model
      - backend_data:/app/uploads
      - backend_data:/app/resumes
      - backend_data:/app/reports
      - backend_data:/app/database
      - backend_data:/app/flask_session
    networks:
      - placement-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Frontend - React + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=/api
    container_name: placement-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=/api
    networks:
      - placement-network

volumes:
  backend_data:

networks:
  placement-network:
    driver: bridge
