# =============================================================================
# Render Blueprint Configuration for Placement Predictor
# https://render.com/docs/blueprint-spec
#
# Deploys TWO services from one blueprint:
#   1. placement-predictor-api      -> Flask + ML backend   (web service)
#   2. placement-predictor-frontend -> React SPA            (static site)
#
# Free-tier notes (these were the cause of the previous validation errors):
#   - Free web services CANNOT have persistent `disk:` -> no disk is defined.
#     The backend auto-trains the model on startup (initialize_model in
#     backend/app.py) and keeps CSV data on the ephemeral instance disk, so
#     a persistent disk is not required.
#   - Static sites are served via Render's CDN and do NOT allow `region`
#     or `plan` -> both are omitted below.
# =============================================================================
services:

  # ── Backend API (Flask + Machine Learning) ────────────────────────────────
  - type: web
    name: placement-predictor-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/requirements.txt
      python -c "import sys, os; sys.path.insert(0, os.path.join(os.getcwd(), 'backend')); from models.placement_model import placement_predictor; placement_predictor.train(); print('Model trained successfully!')"
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:${PORT} --workers 2 --worker-class sync --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DB_TYPE
        value: csv
      - key: CORS_ORIGINS
        value: "*"
      - key: WEB_CONCURRENCY
        value: 2

  # ── Frontend (React static site) ──────────────────────────────────────────
  # IMPORTANT: Render blueprints have NO `type: static` service type. Static
  # sites must use `type: web` with `runtime: static` and publish via
  # `staticPublishPath` (not `publishPath`). The old `type: static` entry
  # caused the "unknown type 'static'" blueprint validation error.
  - type: web
    name: placement-predictor-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://placement-predictor-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
