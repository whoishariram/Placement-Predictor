# ============================================
# Placement Predictor - Render Blueprint Config
# ============================================
# Deploy with: https://render.com/docs/blueprint-spec
# 
# This file defines two services:
# 1. Backend API (Flask + Gunicorn)
# 2. Frontend (React static site)
#
# To deploy:
# 1. Push code to GitHub
# 2. Connect repo to Render
# 3. Use "Blueprint" deploy method
# ============================================

services:
  # ---- Backend API ----
  - type: web
    name: placement-predictor-api
    env: python
    region: oregon
    plan: free  # Upgrade to starter or professional for production
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/requirements.txt
      pip install gunicorn
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////var/data/placement.db
      - key: CORS_ORIGINS
        value: https://placement-predictor.onrender.com,http://localhost:3000
      - key: MAIL_USERNAME
        sync: false  # Set manually in Render dashboard
      - key: MAIL_PASSWORD
        sync: false  # Set manually in Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1

  # ---- Frontend ----
  - type: web
    name: placement-predictor-ui
    env: static
    region: oregon
    plan: free
    branch: main
    buildCommand: |
      cd frontend
      npm ci
      npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://placement-predictor-api.onrender.com/api
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /api/*
        destination: https://placement-predictor-api.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html
